[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlsapi"
version = "0.1.0"
description = "Official Python client library for mlsapi.dev — Real estate MLS listing ingestion, property intelligence, and Studio visual AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "MLS API Team", email = "support@mlsapi.dev" }
]
keywords = [
    "real-estate",
    "mls",
    "proptech",
    "virtual-staging",
    "generative-ai",
    "floorplan",
    "3d-dollhouse",
    "property-intelligence",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.21.0",
]

[project.urls]
Homepage = "https://mlsapi.dev"
Documentation = "https://docs.mlsapi.dev"
Repository = "https://github.com/mlsapi/mlsapi-python"
Changelog = "https://github.com/mlsapi/mlsapi-python/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/mlsapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
